name: Build publication PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "whitepaper/Q-Framework-v1.0-RC2-*.md"
      - ".github/workflows/build-whitepaper-pdfs.yml"

permissions:
  contents: write

concurrency:
  group: q-framework-publication-pdfs-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install markdown weasyprint

      - name: Build RC2 PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import markdown
          from weasyprint import HTML

          css = """
          @page { size: A4; margin: 18mm 16mm 18mm 16mm; }
          body {
            font-family: "Noto Sans CJK TC", "Noto Sans CJK JP", sans-serif;
            line-height: 1.65; font-size: 10.5pt; color: #161616;
          }
          h1 { font-size: 24pt; margin: 0 0 10mm 0; }
          h2 { font-size: 16pt; margin-top: 8mm; border-bottom: 1px solid #ccc; padding-bottom: 2mm; }
          h3 { font-size: 12.5pt; margin-top: 6mm; }
          blockquote { border-left: 4px solid #555; margin-left: 0; padding-left: 10px; color: #444; }
          code, pre { font-family: monospace; font-size: 9pt; }
          pre { white-space: pre-wrap; background: #f4f4f4; padding: 8px; }
          table { border-collapse: collapse; width: 100%; font-size: 9pt; }
          th, td { border: 1px solid #bbb; padding: 5px; vertical-align: top; }
          """

          for mdfile in sorted(Path("whitepaper").glob("Q-Framework-v1.0-RC2-*.md")):
              body = markdown.markdown(
                  mdfile.read_text(encoding="utf-8"),
                  extensions=["tables", "fenced_code"],
              )
              html = f"<html><head><meta charset='utf-8'><style>{css}</style></head><body>{body}</body></html>"
              outfile = mdfile.with_suffix(".pdf")
              HTML(string=html, base_url=".").write_pdf(outfile)
              print("built", outfile)
          PY

      - name: Commit generated RC2 PDFs
        run: |
          git config user.name "q-framework-bot"
          git config user.email "59273422+yuyu19761121@users.noreply.github.com"
          git add whitepaper/Q-Framework-v1.0-RC2-*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes."
          else
            git commit -m "Build Q-Framework v1.0 RC2 PDFs"
            git push origin HEAD:main
          fi
